        clientCredentials:
          scopes:
            video-cloud/livev2/jobs/all: "\t\tgrants job admin access"
            video-cloud/livev2/jobs/create: "\tgrants job create access"
            video-cloud/livev2/jobs/delete: "\tgrants job delete access"
            video-cloud/livev2/jobs/read: "\t\tgrants job read access"
            video-cloud/livev2/jobs/update: "\tgrants job change access"
            video-cloud/livev2/metrics/read: "\tgrants metric read access"
          tokenUrl: https://oauth.brightcove.com/v4/access_token
      in: Header
      type: oauth2
info:
  description: API for interacting with the Brightcove Live platform
  title: Brightcove Live API
  version: 2.0.0
  x-bc-access: public
openapi: 3.0.0
paths:
  /accounts/{account_id}/jobs:
    get:
      parameters:
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
        - description: regions to query, comma separated values
          in: query
          name: regions
          schema:
            items:
              type: string
            type: array
        - description: modified_at filter - format <op>:<unixmillis>
          in: query
          name: modified_at
          schema:
            type: string
        - description: created_at filter - format <op>:<unixmillis>
          in: query
          name: created_at
          schema:
            type: string
        - description: filter by processing state
          in: query
          name: processing_state
          schema:
            type: string
        - description: filter by ingest state
          in: query
          name: ingest_state
          schema:
            type: string
        - description: filter by type
          in: query
          name: type
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.ListJobsResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/read
      summary: List all jobs in an account
      tags:
        - jobs
    post:
      parameters:
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/endpoint.ConfigureJobRequest'
            example:
              name: "Live Stream with RTMP Output"
              description: "Example job configuration with RTMP streaming"
              type: "channel"
              region: "us-east-1"
              input:
                protocol: "rtmp"
              outputs:
                video:
                  - label: "1080p"
                    height: 1080
                    width: 1920
                    bitrate: 6000000
                    codec: "h264"
                    framerate: "30/1"
                    codec_options:
                      profile: "main"
                  - label: "720p"
                    height: 720
                    width: 1280
                    bitrate: 3000000
                    codec: "h264"
                    framerate: "30/1"
                    codec_options:
                      profile: "main"
                audio:
                  - label: "english"
                    codec: "aac"
                    bitrate: 128000
                    sample_rate: 48000
                  - label: "spanish"
                    codec: "aac"
                    bitrate: 128000
                    sample_rate: 48000
                rtmp:
                  - label: "primary_rtmp"
                    url: "rtmp://primary.example.com/live/stream_key_1"
                    video_label: "1080p"
                    audio_label: "english"
                  - label: "backup_rtmp"
                    url: "rtmps://backup.example.com/live/stream_key_2"
                    video_label: "720p"
                    audio_label: "spanish"
        description: Job Config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Job'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/create
      summary: Configure a new job
      description: |
        Create a new live streaming job with various output configurations including HLS/DASH manifests and RTMP outputs.
        
        **RTMP Output Configuration:**
        - RTMP outputs allow streaming to external RTMP/RTMPS endpoints simultaneously
        - Referenced video outputs must use H.264 codec
        - Referenced audio outputs must use AAC codec
        - RTMP outputs are not supported with redundancy configurations
        - Both `rtmp://` and `rtmps://` protocols are supported
      tags:
        - jobs
  /accounts/{account_id}/jobs/{id}:
    delete:
      parameters:
        - description: Job ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Job ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.FinishJobResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/delete
      summary: Finish a job
      tags:
        - jobs
    get:
      parameters:
        - description: Job ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Job'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/read
      summary: Get a job
      tags:
        - jobs
    put:
      parameters:
        - description: Job ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/external.JobConfig'
            example:
              type: "channel"
              region: "us-east-1"
              input:
                protocol: "rtmp"
              outputs:
                video:
                  - label: "1080p"
                    height: 1080
                    width: 1920
                    bitrate: 6000000
                    codec: "h264"
                    framerate: "30/1"
                    codec_options:
                      profile: "main"
                audio:
                  - label: "english"
                    codec: "aac"
                    bitrate: 128000
                    sample_rate: 48000
                rtmp:
                  - label: "updated_rtmp"
                    url: "rtmp://updated.example.com/live/new_stream_key"
                    video_label: "1080p"
                    audio_label: "english"
        description: Job Config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.UpdateJobResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/update
      summary: Update a given job
      description: |
        Update an existing live streaming job configuration
      tags:
        - jobs
  /accounts/{account_id}/jobs/{id}/clip:
    post:
      parameters:
        - description: Job ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/endpoint.ClipRequest'
        description: Clip Config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.ClipResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/create
      summary: Clip a given job
      tags:
        - jobs
  /accounts/{account_id}/jobs/{id}/failover:
    put:
      parameters:
        - description: Job ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Job ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        description: Pipeline to fail over from
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/endpoint.ForceFailoverResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/update
      summary: Force Failover to a different pipeline
      tags:
        - jobs
  /accounts/{account_id}/jobs/{id}/scheduler:
    get:
      parameters:
        - description: Job ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Account ID
          in: path
          name: account_id
          required: true
          schema:
            type: string
        - description: max number of schedules to return
          in: query
