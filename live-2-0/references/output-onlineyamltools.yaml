            application/json:
              schema:
                $ref: '#/components/schemas/external.Error'
          description: Internal Server Error
      security:
        - BC_OAuth2:
            - video-cloud/livev2/jobs/read
      summary: List all schedules of a job
      tags:
        - scheduler
  /accounts/{account_id}/jobs/{id}/scheduler/autostop:
