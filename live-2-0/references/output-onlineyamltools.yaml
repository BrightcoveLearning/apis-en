        - VideoCodecLevel5_1
        - VideoCodecLevel5_2
    external.VideoCodecOptions:
      properties:
        level:
          $ref: '#/components/schemas/external.VideoCodecLevel'
        profile:
          $ref: '#/components/schemas/external.VideoCodecProfile'
      type: object
    external.VideoCodecProfile:
      enum:
        - baseline
        - high
        - main
      type: string
      x-enum-varnames:
        - VideoCodecProfileBaseline
        - VideoCodecProfileHigh
        - VideoCodecProfileMain
        - VideoCodecProfileHigh10bit
        - VideoCodecProfileHigh422
        - VideoCodecProfileHigh42210bit
    github_com_brightcove_blive_notifications-agent_models.Notification:
      properties:
        code:
          type: string
        message:
          type: string
        resource_id:
          type: string
        resource_type:
