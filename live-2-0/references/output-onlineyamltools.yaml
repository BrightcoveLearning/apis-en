        unit:
          type: string
      type: object
    jobmetrics.ResultValue:
      properties:
        dimension:
          $ref: '#/components/schemas/jobmetrics.Dimension'
        metric:
          $ref: '#/components/schemas/jobmetrics.MetricOutput'
        values:
          items:
            items: {}
            type: array
          type: array
          uniqueItems: false
      type: object
    probes.healthCheck:
      properties:
        build_version:
          type: string
        git_sha:
          type: string
      type: object
    ssai.AdConfiguration:
      properties:
        account_id:
          type: string
        ad_server:
