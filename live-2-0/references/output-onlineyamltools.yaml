          type: string
          example: "fullhd"
        url:
          description: The RTMP or RTMPS destination URL where the stream will be pushed.
          type: string
          format: uri
          pattern: "^rtmps?://.+"
          example: "rtmp://example.com/application/stream_key"
        video_label:
          description: Reference to an existing video output label. The referenced video output must use H.264 codec.
          type: string
          example: "1080p"
      required:
