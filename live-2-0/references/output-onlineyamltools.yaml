    external.VariantRTMPInfo:
      description: Configuration for RTMP output destinations. RTMP outputs allow streaming to external RTMP/RTMPS endpoints.
      properties:
        audio_label:
          description: Reference to an existing audio output label. The referenced audio output must use AAC codec.
          type: string
          example: "english"
        label:
